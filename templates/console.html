<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f6;--panel:#fff;--ink:#1d1d1b;--muted:#5f5e59;--rule:#e3e1da;--accent:#1f5f7a;--soft:#e6f0f4;--warn:#8a6d1f;--warnsoft:#f7efd6;--ok:#2f6b3a;--oksoft:#e4f1e6;--code:#f1efe9}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--panel:#1f1f1c;--ink:#ebe9e2;--muted:#a8a59b;--rule:#34332f;--accent:#7fb7d3;--soft:#1e2c33;--warn:#e0c069;--warnsoft:#33301f;--ok:#8fd19a;--oksoft:#1f2f22;--code:#24241f}}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;padding:0 16px 48px;color:var(--ink);background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 24px;padding:22px 0 12px;border-bottom:1px solid var(--rule)}
h1{font-size:24px;margin:0}.gen{color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}nav button{border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}nav .badge{margin-left:6px;background:var(--warnsoft);color:var(--warn);padding:0 7px;border-radius:999px;font-size:12px}
input.search{width:100%;max-width:520px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px;margin:4px 0 14px}
.lead{font-size:16px;margin:10px 0 18px}
h2{font-size:17px;margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer}.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:15px}.card .meta{font-size:12.5px;color:var(--muted)}.card p{margin:6px 0 0;font-size:13.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-right:4px}
.tag.warn{background:var(--warnsoft);color:var(--warn)}.tag.ok{background:var(--oksoft);color:var(--ok)}
.stale{border-left:4px solid var(--warn)}.fresh{border-left:4px solid var(--ok)}
#detail{position:fixed;top:0;right:0;width:min(640px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--rule);padding:22px 24px 48px;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:none}
#detail.open{display:block}#detail .close{float:right;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#detail h2{text-transform:none;letter-spacing:0;color:var(--ink);font-size:20px;margin:0 0 6px}#detail h4{margin:16px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
pre,code{font:12.5px ui-monospace,Menlo,monospace;background:var(--code);border-radius:6px}pre{padding:10px;overflow:auto;white-space:pre-wrap}code{padding:1px 5px}
ul.plain{padding-left:18px;margin:4px 0}li{margin:2px 0}.muted{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-top:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13.5px}
.dtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:22px}.dtop h2{margin:0}
.checknow{border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px}.checknow:hover{border-color:var(--accent)}
.dgrid{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))}.card.dash{min-width:0}.card.dash code,.card.dash a{overflow-wrap:anywhere}.card.dash{cursor:default;display:flex;flex-direction:column;gap:4px}.card.dash p{margin:2px 0 0}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.dstate{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.55;margin-right:5px;vertical-align:baseline}
.dot.up{background:var(--ok);opacity:1}.dot.down{background:var(--warn);opacity:1}.dot.file{background:var(--accent);opacity:.8}
.dstate.up{color:var(--ok)}.dstate.down{color:var(--warn)}
.cmdrow{display:flex;gap:6px;align-items:stretch;margin-top:4px}.cmdrow pre{flex:1;min-width:0;margin:0;padding:6px 8px;user-select:all}
.copy{border:1px solid var(--rule);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;padding:0 8px}.copy:hover{color:var(--ink);border-color:var(--accent)}
details.devs{margin:14px 0 4px}details.devs summary{cursor:pointer;font-size:14px;color:var(--muted)}details.devs summary b{color:var(--ink)}details.devs table{margin-top:8px}
nav.jump{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0 0;font-size:13.5px}nav.jump a{color:var(--accent);text-decoration:none}nav.jump a:hover{text-decoration:underline}
.arts .lead{font-size:14.5px;color:var(--muted);margin:6px 0 12px}
details.major{margin-top:22px;padding-top:4px}details.major+details.major,.arts{border-top:1px solid var(--rule);margin-top:26px;padding-top:8px}
details.major>summary{cursor:pointer;font-size:17px;color:var(--muted);margin:0}details.major>summary h2{display:inline;margin:0}details.major>summary:hover h2{color:var(--ink)}
details.major>.dtop{margin-top:8px}details.major:not([open]){padding-bottom:2px}
.afilter{padding:5px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13.5px;width:min(300px,100%)}
.agroup{margin:0 0 14px}.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:0 0 4px;font-size:14.5px}.gname{font-weight:600;color:var(--ink)}
.astatus{font-size:13px;color:var(--muted);background:var(--code);border-radius:6px;padding:1px 7px;max-width:min(640px,100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#research .ablurb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.alist{list-style:none;padding:0 0 0 12px;margin:0;border-left:2px solid var(--rule)}ul.alist li{margin:0;padding:5px 0 6px}
.aline{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}.atitle{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.atitle:hover{color:var(--accent);text-decoration:underline}
.kinds{display:inline-flex;gap:4px}a.kind{font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 6px;border:1px solid var(--rule);border-radius:4px;color:var(--accent);text-decoration:none}a.kind:hover{border-color:var(--accent)}
.ablurb{font-size:13.5px;margin:1px 0}.why{font-size:13.5px;margin:3px 0}.aitem .meta{font-size:12.5px;color:var(--muted)}.aitem .meta a{color:var(--muted)}.aitem code{overflow-wrap:anywhere}
.agrid{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}.card.art{cursor:default;display:flex;flex-direction:column;gap:3px;min-width:0}.card.art h3{font-size:15px;margin:0}.card.art p{margin:2px 0}
.pchips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}.pchip{border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}.pchip:hover,.pchip.on{border-color:var(--accent);color:var(--accent)}.pchips:not(.live) .pchip{cursor:default}a.tag.pc{align-self:flex-start;text-decoration:none}
ul.recent{list-style:none;margin:0;padding:0}.rrow .rcmd{margin-left:auto}
.rrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:5px 0;border-bottom:1px solid var(--rule);min-width:0}
.rrow .rk{min-width:86px;text-align:center}.rk-dashboard,.rk-service,.rk-dev{background:var(--oksoft);color:var(--ok)}.rk-agent{background:var(--warnsoft);color:var(--warn)}
.rtitle{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.rtitle:hover{color:var(--accent);text-decoration:underline}
.rdirect{color:var(--accent);text-decoration:none;font-size:14px}.rmeta{font-size:12.5px;color:var(--muted)}.rrange{text-transform:none;letter-spacing:0;font-size:14px}
.rcmd{display:inline-flex;gap:4px;align-items:center;min-width:0;max-width:100%}.rcmd code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;user-select:all;font-size:11.5px}.rcopy{padding:1px 7px;font-size:11px}
details.rmore{margin:6px 0 0}.card:target,li:target,tr:target{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
details.more{margin:2px 0 0 14px}details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
.aitem.hide,.agroup.hide{display:none}
h2.break{font-size:20px;color:var(--ink);margin:36px 0 0;text-transform:none;letter-spacing:0}
details#agents{border-top:2px solid var(--rule);margin-top:36px;padding-top:14px}details#agents>summary{font-size:20px}details#agents>summary h2.break{margin:0}details#agents>nav{margin-top:12px}
@media (max-width:420px){.dgrid{grid-template-columns:1fr}}
@media print{#detail{position:static;width:auto;box-shadow:none}}
</style>
</head>
<body>
<header><h1>Concierge</h1><span class="gen" id="gen"></span><span class="gen">the agent that keeps track of the agents · local, derived from git, READMEs, handovers and the vault · overlay in your words</span></header>
<!--__JUMP__-->
<!--__RECENT__-->
<!--__HANDOVERS__-->
<!--__DASHBOARDS__-->
<!--__ARTEFACTS__-->
<!--__AGENTS__-->
<nav id="nav"></nav>
<input class="search" id="q" placeholder="filter by name, artefact, project, word…">
<div id="view"></div>
</details>
<aside id="detail"><button class="close" onclick="closeDetail()">×</button><div id="detailBody"></div></aside>
<script>
const D = /*__DATA__*/null;
const views = ["agents","moved","streams","themes","insights","drift"];
let cur = "agents", q = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const days = d => d ? Math.round((new Date(D.generated.slice(0,10)) - new Date(d)) / 86400000) : null;
function ov(id){ return D.overlay[id] || {}; }
function stageOf(e){ const o = ov(e.id); if (o.stage) return o.stage; return e.is_agent ? "unrecorded" : "repo"; }
function nav(){ $("#nav").innerHTML = views.map(v => `<button class="${v===cur?'on':''}" onclick="go('${v}')">${v}${v==='drift'&&D.drift.length?`<span class=badge>${D.drift.length}</span>`:''}</button>`).join(""); }
function go(v){ cur = v; nav(); render(); }
function match(o){ if(!q) return true; return JSON.stringify(o).toLowerCase().includes(q.toLowerCase()); }
function card(e){ const o = ov(e.id), d = days(e.last_commit), cls = d>30?'stale':(d<=7?'fresh':'');
  return `<div class="card ${cls}" id="g-${e.id.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}" onclick="detail('${e.id}')"><h3>${esc(e.title.length>60?e.id:e.title)}</h3><div class=meta>${esc(e.id)} · last ${esc(e.last_commit)} (${d}d) · ${e.commits} commits${e.commits_7d?` · <b>${e.commits_7d} this week</b>`:''}</div>
  <div style="margin-top:6px">${e.artefacts.map(a=>`<span class=tag>${esc(a)}</span>`).join("")}${e.code?'<span class=tag>code</span>':''}${o.stage?`<span class="tag ok">${esc(o.stage)}</span>`:'<span class="tag warn">no record</span>'}</div>
  <p>${esc(o.next ? "Next: "+o.next : (e.summary||"").slice(0,180))}</p></div>`; }
function renderAgents(){ const groups = {}; for (const s of [...D.stages,"unrecorded","repo"]) groups[s]=[];
  for (const e of D.registry.filter(match)) (groups[stageOf(e)] ||= []).push(e);
  let h = `<p class=lead>${D.registry.filter(e=>e.is_agent).length} agents and harnesses across ${D.registry.length} repos. Cards with a green edge moved this week; amber edge is 30+ days idle. Click a card for where you got to.</p>`;
  for (const [s, list] of Object.entries(groups)) { if(!list.length) continue; list.sort((a,b)=> (b.last_commit||"").localeCompare(a.last_commit||""));
    h += `<h2>${esc(s)} <span class=muted>(${list.length})</span></h2><div class=grid>${list.map(card).join("")}</div>`; }
  return h; }
function renderMoved(){ return `<p class=lead>Commits in the last seven days.</p><h2>research</h2><ul class=plain>${D.moved.research.filter(match).map(s=>`<li>${esc(s)}</li>`).join("")}</ul><h2>vault</h2><ul class=plain>${D.moved.vault.filter(match).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`; }
function renderStreams(){ return `<p class=lead>Every research project from the master index, as it stands.</p><table><tr><th>Project</th><th>Status</th><th>Gist</th></tr>${D.streams.filter(match).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.status)}</td><td>${esc(s.gist)}</td></tr>`).join("")}</table>`; }
function renderThemes(){ return `<p class=lead>Connection pages from the vault scan: the ideas that link projects.</p><div class=grid>${D.themes.filter(match).map(t=>`<div class=card><h3>${esc(t.title)}</h3><div class=meta>${esc(t.status)}</div><p class=muted>${t.related.slice(0,8).map(r=>`<code>${esc(r)}</code>`).join(" ")}</p></div>`).join("")}</div>`; }
function renderInsights(){ return `<p class=lead>The bold first sentence of every key finding, newest project first.</p><table><tr><th>Date</th><th>Project</th><th>Insight</th></tr>${D.insights.filter(match).map(i=>`<tr><td class=muted>${esc(i.date)}</td><td>${esc(i.project)}</td><td>${esc(i.insight)}</td></tr>`).join("")}</table>`; }
function renderDrift(){ return `<p class=lead>Where the record and the code disagree. The steward raises these in the weekly brief.</p><table><tr><th>Agent</th><th>Kind</th><th>Detail</th></tr>${D.drift.filter(match).map(d=>`<tr><td><a href="#" onclick="detail('${d.id}');return false">${esc(d.id)}</a></td><td>${esc(d.kind)}</td><td>${esc(d.detail)}</td></tr>`).join("")}</table>`; }
function render(){ $("#view").innerHTML = ({agents:renderAgents,moved:renderMoved,streams:renderStreams,themes:renderThemes,insights:renderInsights,drift:renderDrift})[cur](); }
function detail(id){ const e = D.registry.find(x=>x.id===id); if(!e) return; const o = ov(id);
  $("#detailBody").innerHTML = `<h2>${esc(e.title)}</h2><div class=muted>${esc(e.id)} · <code>${esc(e.path)}</code></div>
  <div class=kv style="margin-top:12px"><b>Stage</b><span>${esc(o.stage||"unrecorded")}${e.declared_stage?` <span class=muted>(README says: ${esc(e.declared_stage)})</span>`:''}</span><b>Last commit</b><span>${esc(e.last_commit)} (${days(e.last_commit)} days ago) · ${e.commits} total · ${e.commits_30d} in 30 days</span><b>Artefacts</b><span>${esc(e.artefacts.join(", ")||"none")}${e.code?", code":""}</span><b>Record</b><span>${o.updated?`${esc(o.updated)} by ${esc(o.by||"")}`:"none yet"}</span></div>
  <h4>What it is</h4><p>${esc(e.summary||"(no README summary)")}</p>
  <h4>Where I was going</h4><p>${esc(o.going||"—")}</p><h4>Next step</h4><p>${esc(o.next||"—")}</p>${o.notes?`<h4>Notes</h4><p>${esc(o.notes)}</p>`:''}
  <h4>How to run</h4>${(o.run||e.how_to_run.join("\n\n"))?`<pre>${esc(o.run||e.how_to_run.join("\n\n"))}</pre>`:'<p class=muted>not recorded</p>'}
  <h4>Research</h4><p>${(e.research_projects||[]).map(r=>`<code>${esc(r)}</code>`).join(" ")||"—"}${e.latest_handover?`<br>latest handover: <code>${esc(e.latest_handover)}</code>`:''}</p>
  <h4>Wiki</h4><p>${(e.wiki_pages||[]).map(w=>`<code>${esc(w)}</code>`).join(" ")||"—"}</p>
  <h4>Recent commits</h4><ul class=plain>${e.recent.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
  <h4>Update the record</h4><pre>python3 ~/Projects/steward/rails/concierge.py note --agent ${esc(e.id)} --stage "…" --going "…" --next "…"\npython3 ~/Projects/steward/rails/concierge.py console</pre>`;
  $("#detail").classList.add("open"); }
function closeDetail(){ $("#detail").classList.remove("open"); }
$("#gen").textContent = "generated " + D.generated; $("#q").addEventListener("input", e => { q = e.target.value; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
// live status for the Dashboards section: from file:// a no-cors fetch that resolves (opaque) means up, a rejection or timeout means down
function probe(url, ms){ const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 4000);
  return fetch(url, {mode:"no-cors", cache:"no-store", signal:c.signal}).then(() => true, () => false).finally(() => clearTimeout(t)); }
function setState(el, st){ el.className = "dstate " + st; el.querySelector(".dot").className = "dot " + (st === "checking" ? "" : st); el.querySelector(".dlabel").textContent = st; }
function checkAll(){ const cards = [...document.querySelectorAll(".card.dash")].filter(c => c.querySelector("[data-probe]"));
  cards.forEach(c => setState(c.querySelector(".dstate"), "checking"));
  Promise.all(cards.map(c => probe(c.dataset.url).then(ok => { setState(c.querySelector(".dstate"), ok ? "up" : "down"); return ok; }))).then(r => {
    const el = $("#checked"); if (el) el.textContent = `${r.filter(Boolean).length} of ${r.length} up · checked ${new Date().toLocaleTimeString("en-NZ", {hour:"2-digit", minute:"2-digit", second:"2-digit"})} · every 60 s`; }); }
document.querySelectorAll(".card.dash .copy").forEach(b => b.addEventListener("click", () => { const t = b.previousElementSibling.textContent;
  const done = () => { b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => { getSelection().selectAllChildren(b.previousElementSibling); b.textContent = "selected"; });
  else { getSelection().selectAllChildren(b.previousElementSibling); b.textContent = "selected"; } }));
if ($("#checknow")) { $("#checknow").addEventListener("click", checkAll); checkAll(); setInterval(checkAll, 60000); }
// per-section filter for Research, Articles, Visualisations and Unfiled; without scripts the boxes stay hidden and every entry shows
document.querySelectorAll(".arts").forEach(sec => { const box = sec.querySelector(".afilter"); if (!box) return; box.hidden = false;
  const count = sec.querySelector(".acount"), total = count ? count.dataset.total : 0;
  box.addEventListener("input", () => { const w = box.value.trim().toLowerCase().split(/\s+/).filter(Boolean); let n = 0;
    sec.querySelectorAll(".aitem").forEach(it => { const ok = w.every(x => it.textContent.toLowerCase().includes(x)); it.classList.toggle("hide", !ok); if (ok) n++; });
    sec.querySelectorAll(".agroup").forEach(g => { const head = g.querySelector(".ghead"), hit = w.length && head && w.every(x => head.textContent.toLowerCase().includes(x));
      if (hit) g.querySelectorAll(".aitem").forEach(it => { if (it.classList.contains("hide")) { it.classList.remove("hide"); n++; } });
      g.classList.toggle("hide", !g.querySelector(".aitem:not(.hide)")); g.querySelectorAll("details.more").forEach(d => d.open = !!w.length); });
    sec.querySelectorAll("details.devs").forEach(d => { if (w.length) d.open = true; });
    if (count) count.textContent = w.length ? `(${n} of ${total})` : `(${total})`;
    sec.querySelectorAll(".pchip").forEach(c => c.classList.toggle("on", box.value === c.dataset.q)); });
  const chips = sec.querySelector(".pchips"); if (chips) { chips.classList.add("live");
    chips.querySelectorAll(".pchip").forEach(c => c.addEventListener("click", () => { box.value = box.value === c.dataset.q ? "" : c.dataset.q; box.dispatchEvent(new Event("input")); })); } });
// major sections are native <details>, all open by default; each one's open or closed state is remembered per browser.
// Jumping to a closed section opens it (without scripts the anchor still lands on its summary line).
const SKEY = "concierge.sections"; let saved = {};
try { saved = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch (e) { saved = {}; }
document.querySelectorAll("details.major").forEach(d => { if (Object.prototype.hasOwnProperty.call(saved, d.id)) d.open = !!saved[d.id];
  d.addEventListener("toggle", () => { saved[d.id] = d.open; try { localStorage.setItem(SKEY, JSON.stringify(saved)); } catch (e) {} }); });
function openSection(id){ const el = id && document.getElementById(id); const d = el && el.closest("details.major"); if (d && !d.open) d.open = true; return el; }
document.querySelectorAll('nav.jump a[href^="#"]').forEach(a => a.addEventListener("click", () => openSection(a.getAttribute("href").slice(1))));
// Recent: open every fold around the target card before the anchor lands; agent cards are drawn by script, so show the agents view first
function reveal(el){ for (let d = el && el.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true; }
document.querySelectorAll("#recent a.rtitle").forEach(a => a.addEventListener("click", ev => {
  if (a.dataset.agent) { ev.preventDefault(); openSection("agents"); if (cur !== "agents" || q) { cur = "agents"; q = ""; $("#q").value = ""; nav(); render(); }
    const el = document.getElementById(a.dataset.target); if (el) { el.scrollIntoView({block:"center"}); el.animate([{outline:"2px solid"},{outline:"2px solid transparent"}], {duration:1600}); } return; }
  const el = document.getElementById(a.dataset.target); if (el) { el.classList.remove("hide"); reveal(el); } }));
document.querySelectorAll(".rcopy").forEach(b => b.addEventListener("click", () => { const c = b.previousElementSibling, t = c.textContent;
  const done = () => { b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => { getSelection().selectAllChildren(c); b.textContent = "selected"; });
  else { getSelection().selectAllChildren(c); b.textContent = "selected"; } }));
window.addEventListener("hashchange", () => { const el = openSection(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); });
if (location.hash) { const el = openSection(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
nav(); render();
</script>
